services:
  - type: web
    name: rajyotsava-tracker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rajyotsava-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CR_PASSWORD_A
        sync: false
      - key: CR_PASSWORD_B
        sync: false
      - key: CR_PASSWORD_C
        sync: false

databases:
  - name: rajyotsava-db
    plan: free
