services:
  - type: web
    name: rajyotsava-tracker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rajyotsava-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CR_PASSWORD_1A
        sync: false
      - key: CR_PASSWORD_1B
        sync: false
      - key: CR_PASSWORD_1C
        sync: false
      - key: CR_PASSWORD_2A
        sync: false
      - key: CR_PASSWORD_2B
        sync: false
      - key: CR_PASSWORD_2C
        sync: false
      - key: CR_PASSWORD_3A
        sync: false
      - key: CR_PASSWORD_3B
        sync: false
      - key: CR_PASSWORD_3C
        sync: false

databases:
  - name: rajyotsava-db
    plan: free
